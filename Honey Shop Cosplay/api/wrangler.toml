name = "honey-shop-api"
main = "src/index.ts"
compatibility_date = "2026-09-19"

[vars]
CORS_ORIGIN = "http://localhost:3000"
APP_URL = "http://localhost:3000"
RESEND_FROM = "Honey Shop <noreply@example.com>"

[[d1_databases]]
binding = "DB"
database_name = "honey-shop-db"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "honey-shop-local"
migrations_dir = "migrations"

# Uncomment after creating an R2 bucket:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "honey-shop-media"
